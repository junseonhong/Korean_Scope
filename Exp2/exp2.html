    //

    //

    //
    // 1 = OBJ ES / OBJ EF / SUBJ ES / SUBJ EF rotation

    //
    // exp2.html?list=1
    // exp2.html?list=2
    // exp2.html?list=3
    // exp2.html?list=4
    //
    // ============================================================

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    let list_number =
      parseInt(
        urlParams.get("list"),
        10
      );


    if (
      ![1, 2, 3, 4].includes(
        list_number
      )
      ) {
      list_number = 1;
    }


    // ============================================================
    // YES / NO BUTTON ORDER
    // ============================================================
    //
    // Test:
    //
    // exp2.html?list=1&buttons=yes-first
    //
    // or:
    //
    // exp2.html?list=1&buttons=no-first
    //
    // ============================================================

    const button_order =
      urlParams.get("buttons");

    const response_buttons =

      button_order === "no-first"

        ? ["아니요", "예"]

        : ["예", "아니요"];

    // ============================================================
    // GLOBAL PARTICIPANT DATA
    // ============================================================

    jsPsych.data.addProperties({
      subject_id: subject_id,
      experiment: "Exp2",
      list_number: list_number,
      yes_no_order: response_buttons.join("|")
    });

    // ============================================================

    // ============================================================
    // FOUR EXPERIMENTAL CONDITIONS

    const experimental_conditions = [

      {
        qp_position:
          "object",

        context_condition:
          "ES"
      },

      {
        qp_position:
          "object",

        context_condition:
          "EF"
      },

        context_condition:

        context_condition:
          "EF"
      }

    ];

    // ============================================================
    // SELECT TARGETS FOR THIS LIST
    // ============================================================

    const selected_targets =
      window.EXP2_STIMULI.filter(stim => {

        // Items cycle through the four conditions.
        // List number rotates that assignment.
        const base_condition =
          (stim.item - 1) % 4;

        const condition_index =
          (
            base_condition +
            (list_number - 1)
          ) % 4;

        const required_condition =
          experimental_conditions[
            condition_index
          ];

        return (
          stim.qp_position ===
            required_condition.qp_position
          &&
          stim.context_condition ===
            required_condition.context_condition
        );

      });


    // Randomize order of lexical items
    const randomized_targets =
      jsPsych.randomization.shuffle(
        selected_targets
      );

    // ============================================================
    // CONTEXT VIEWING TIME
    // ============================================================

    let context_viewing_rt = null;

    // ============================================================
    // STAGE 1: CONTEXT ONLY
    // ============================================================

    function makeContextTrial(item) {

      return {

        type: jsPsychHtmlButtonResponse,

        stimulus: `
          <div class="trial-card">

            <div class="context-block stage1-context">

              <p class="picture-description">
                먼저 다음과 같은 상황이 있었습니다.
              </p>

              <img
                class="experiment-image"
                src="${item.context_image}"
              >

            </div>

          </div>
        `,

        choices: ["다음"],
        css_classes: ["context-stage"],

        data: {
          item_id: item.id,
          item_type: "context",
          context_condition: item.context_condition
        },

        on_finish: function(data) {

          // Save how long the participant looked at the context
          context_viewing_rt = data.rt;

        }

      };

    }


    // ============================================================
    // STAGE 2: CONTEXT + CRITICAL PICTURE + SENTENCE
    // ============================================================

    function makeJudgmentTrial(item) {

      return {

        type: jsPsychHtmlButtonResponse,

        stimulus: `

        <div class="trial-card">

            <div class="context-block">

              <p class="picture-description">
                먼저 다음과 같은 상황이 있었습니다.
              </p>

              <img
                class="experiment-image"
                src="${item.context_image}"
              >

            </div>


            <div class="critical-block">

              <p class="picture-description">
                이어서 다음과 같은 상황이 있었습니다.
              </p>

              <img
                class="experiment-image"
                src="${item.critical_image}"
              >

            </div>


            <div class="target-box">

              <p class="target-sentence">
                ${item.sentence}
              </p>

            </div>

            <p class="trial-question">
              이 문장이 두번째 상황을 자연스럽게 설명하나요?
            </p>

          </div>

      `,

        choices: response_buttons,

        data: {

          item_id: item.id,
          item_type: "target",
          item: item.item,
          qp_position: item.qp_position,
          context_condition: item.context_condition,
          sentence: item.sentence,
          context_image: item.context_image,
          critical_image: item.critical_image

        },

        on_finish: function(data) {

          const selected_label =
            response_buttons[data.response];

          data.response_label =
            selected_label;

          data.response_binary =
            selected_label === "예"
              ? "yes"
              : "no";


          // Store how long the context was viewed
          data.context_viewing_rt =
            context_viewing_rt;


          // Remove fields we don't need
          delete data.rt;
          delete data.stimulus;
          delete data.response;
          delete data.trial_type;
          delete data.trial_index;
          delete data.plugin_version;
          delete data.time_elapsed;

        }

      };

    }



    // ============================================================
    // ADD TARGETS TO TIMELINE
    // ============================================================

    randomized_targets.forEach(
      item => {

        // Stage 1: context only
        timeline.push(
          makeContextTrial(item)
        );

        // Stage 2: context + critical picture + judgment
        timeline.push(
          makeJudgmentTrial(item)
        );

      }
    );

    // ============================================================
    // LOCAL TEST END SCREEN
    // ============================================================

    timeline.push({

      type:
        jsPsychHtmlButtonResponse,

      stimulus: `

        <div class="begin-box">

          <h2>
            Local test mode
          </h2>

          <p>
            실험이 끝났습니다.
          </p>

          <p>
            아래 버튼을 눌러
            수집된 데이터를 확인해 주세요.
          </p>

        </div>

      `,

      choices:
        ["데이터 확인"]

    });



    // ============================================================
    // DATA PREVIEW
    // ============================================================

    timeline.push({

      type:
        jsPsychHtmlKeyboardResponse,


      stimulus:
        function() {


          const target_data =

            jsPsych.data
              .get()
              .values()
              .filter(

                data =>
                  data.item_type
                  === "target"

              );


          return `

            <div class="data-box">

              <h2>
                Collected target data
              </h2>

              <pre
                style="
                  white-space: pre-wrap;
                  background: #f8fafc;
                  padding: 20px;
                  border-radius: 10px;
                  font-size: 14px;
                  overflow: auto;
                "
              >${JSON.stringify(
                target_data,
                null,
                2
              )}</pre>

            </div>

          `;

        },


      choices:
        "NO_KEYS"

    });



     // END stimulus-loaded check



    // ============================================================
    // RUN
    // ============================================================

    jsPsych.run(
      timeline
    );


    </script>


    </body>

    </html>
