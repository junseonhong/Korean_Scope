<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 3</title>
  <!-- Load JsPsych -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  
  <!-- Load Stimuli -->
  <script src="stims_exp3.js"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  
  <!-- Load Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* General page */
    body,
    .jspsych-content,
    .jspsych-content-wrapper {
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .jspsych-content-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    h1,
    h2,
    h3 {
      color: #2c3e50;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* jsPsych buttons */
    .jspsych-btn {
      font-size: 14px;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 8px;
      background-color: #64748b;
      color: white;
      border: none;
      cursor: pointer;
    }

    .jspsych-btn:hover {
      background-color: #475569;
    }

    /* Consent */
    .jspsych-content .consent p {
      font-size: 16px;
      line-height: 1.4;
      text-align: justify;
    }

    .jspsych-content .consent h3 {
      font-size: 18px;
      line-height: 1.4;
    }

    /* Instructions */
    .content {
      margin-top: 20px;
    }

    .example-box {
      background:  paleturquoise;
      padding: 12px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .jspsych-instructions-nav {
      margin-top: 30px;
      text-align: center;
    }

    .inst-box {
      background-color: lemonchiffon;
      border-radius: 12px;
      padding: 18px;
    }

    .instruction-example-image {
      width: 100%;
      max-width: 400px;
      height: auto;
      display: block;
      margin:
        20px auto;
    }

  /* Start screen */
    .begin-box {
      background-color: #e0f2fe;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .begin-box p {
      font-size: 22px;
      font-weight: 500;
    }

    /* Experimental Trials */

    :root {
      --stimulus-width: 800px;
    }

    .trial-card {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .trial-label {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }

    .sentence-box {
      background-color: #f8fafc;
      padding: 20px 25px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .target-sentence,
    .probe-sentence {
      font-size: 22px;
      font-weight: 500;
      margin: 0;
      line-height: 1.6;
    }

    .trial-question {
      font-size: 19px;
      font-weight: 500;
      margin-top: 30px;
    }

    .picture-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
    }

    .experiment-image {
      width: 100%;
      max-width: var(--stimulus-width);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .jspsych-content.experiment-stage {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto !important;
      padding: 0;
      text-align: center;
    }

    .target-box {
      margin-top: 25px;
    }

    /* Saving */
    .saving-box {
      background-color: #ecfdf5;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .saving-box h2 {
      margin-top: 0;
      color: #047857;
    }

    /* Completion */
    .completion-box {
      background-color: #f0fdf4;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .completion-box h2 {
      margin-top: 0;
      color: #15803d;
    }

    /* Progress Bar */  
    #jspsych-progressbar-container {
      background-color: #f3f7f4;
      padding: 10px 0;
      margin-bottom: 20px;
    }

    #jspsych-progressbar-outer {
      width: 90%;
      margin: 0 auto;
      height: 12px;
      background-color: #dfe9e2;
      border-radius: 8px;
      overflow: hidden;
    }

    #jspsych-progressbar-inner {
      height: 100%;
      background: linear-gradient(90deg, #b7d9c2 0%,#74b68b 55%, #3f8f5f 100%);
      transition: width 0.4s ease;
      border-radius: 8px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.45);
    }
  </style>

</head>
<body>
  <script>
    // Initialize jsPsych
    const jsPsych =
      initJsPsych({
        show_progress_bar: true,
        message_progress_bar: ""
      });
    const DATAPIPE_EXPERIMENT_ID = "REPLACE_WITH_EXP3_ID";
    const subject_id =  jsPsych.randomization.randomID(10);

    // Participant Assignment
    // 2 prime groups × 2 Yes/No button orders = 4 cells
    const assignment_cell =
      Math.floor(Math.random() * 4);

    // Prime condition
    const prime_group =
      assignment_cell < 2
        ? "inverse"
        : "control";

    // Counterbalance Yes / No button order
    const response_buttons =
      assignment_cell % 2 === 0
        ? ["예", "아니오"]
        : ["아니오", "예"];

    const timeline = [];

    // Consent
    const consent = {
      type: jsPsychHtmlButtonResponse,
      record_data: false,
      stimulus: `
        <div class="consent">
          <h2 style="text-align:center;">
            연구 참여 안내 및 동의
          </h2>
          <h3 style="text-align:center;">
            언어 이해 및 해석에 관한 행동 연구
          </h3>
          <p style="text-align: center;">
            <strong>연구 개요</strong>
          </p>
          <p>
            귀하는 언어와 의사소통에 관한 연구에 참여하도록 요청받았습니다.
            본 연구의 목적은 사람들이 다양한 맥락에서 문장을 어떻게 사용하고 해석하는지 이해하는 것입니다.
            귀하는 간단한 그림을 보고, 제시된 문장이 그림을 자연스럽게 설명하는지 판단하게 됩니다.
            본 연구 참여는 자발적이며, 언제든지 연구 참여를 중단하실 수 있습니다. 연구에 참여하지 않거나 참여를 중단하더라도 어떠한 불이익도 없습니다.
          </p>
          <p style="text-align: center;">
            <strong>소요 시간</strong>
          </p>
          <p>
            연구 참여에는 약 15분이 소요될 예정입니다.
          </p>
          <p style="text-align: center;">
            <strong>참여 보상</strong>
          </p>
          <p>
            연구 참여에 대한 보상으로 5,000원을 지급해 드립니다. 실험 종료 후, 보상 지급을 위해 계좌 정보를 수집할 예정입니다. 
            해당 정보는 보상 지급 이외의 용도로 사용되지 않으며, 목적 달성 후 즉시 폐기됩니다.
          </p>
          <p style="text-align: center;">
            <strong>개인정보 및 비밀유지</strong>
          </p>
          <p>
            본 연구 참여로 인해 발생할 수 있는 일상생활에서 일반적으로 경험하는 수준을 넘어서는 알려진 위험은 없습니다.
            귀하의 응답 내용은 외부에 공개되지 않으며, 성별 나이 등의 개인정보는 식별 불가능하게 처리되어 관련 규정에 의해 보호됩니다.
            본 연구 결과를 바탕으로 작성되는 보고서나 논문 등의 자료에는 귀하를 식별할 수 있는 정보가 포함되지 않습니다.
          </p>
          <p style="text-align: center;">
            <strong>연구 관련 문의:</strong>
          </p>
          <p>
            연구 내용이나 절차, 연구 참여로 인한 위험 및 이점에 대한 질문, 혹은 연구와 관련된 우려 또는 불만 사항이 있는 경우 연구책임자인 홍준선 (junseonh@stanford.edu, 1-650-723-4284)에게 연락하시기 바랍니다. 
          </p>
          <h3>
            연구 참여에 동의하시는 경우, 아래의 “동의하고 계속”을 클릭해 주십시오.
          </h3>
       </div>
      `,
      choices: ["동의하고 계속"],
    };

    timeline.push(consent);

    // Eligibility
    let eligibility_passed = false;
    let retry_eligibility = false;
    const eligibility_check = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
        <div style="max-width:700px; margin:auto; text-align:center;">
          <h3>
            연구 참여에 동의해 주셔서 감사합니다.
          </h3>
          <h3>
            본 연구의 대상은 만 18세 이상의 한국어 화자입니다.
          </h3>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:auto;">
          <div style="margin:30px 0;">
            <p style="text-align:center;">
              <strong>
                1. 만 18세 이상이신가요?
              </strong>
            </p>

            <div style="text-align:center;">
              <label style="margin-right:25px;">
                <input
                  type="radio"
                  name="age_18"
                  value="yes"
                  required
                >
                예
              </label>
              <label>
                <input
                  type="radio"
                  name="age_18"
                  value="no"
                >
                아니요
              </label>
            </div>
          </div>

          <div style="margin:30px 0;">

            <p style="text-align:center;">
              <strong>
                2. 어린 시절부터 한국어를 자연스럽게 습득하셨나요?
              </strong>
            </p>

            <div style="text-align:center;">
              <label style="margin-right:25px;">
                <input
                  type="radio"
                  name="native_korean"
                  value="yes"
                  required
                >
                예
              </label>
              <label>
                <input
                  type="radio"
                  name="native_korean"
                  value="no"
                >
                아니요
              </label>
            </div>
          </div>
        </div>
      `,
      button_label: "계속",
      data: {phase: "eligibility"},
      on_finish: function(data) {
        eligibility_passed =
          data.response.age_18 === "yes" &&
          data.response.native_korean === "yes";
        retry_eligibility = false;
      }
    };
   
    // Ineligible Screen
    const eligibility_failed_trial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="completion-box">
          <p>
            죄송하지만 본 연구의 참여 조건에 해당하지 않습니다.
          </p>
          <p>
            응답을 잘못 선택하셨다면
            <strong>“다시 확인하기”</strong>를 눌러 주세요.
          </p>
          <p>
            관심을 가져주셔서 감사합니다.
          </p>
        </div>
      `,
      choices: [
        "다시 확인하기",
        "실험 종료"
      ],
      on_finish: function(data) {
        if (data.response === 0) {
          retry_eligibility = true;
        } else {
          jsPsych.abortExperiment(`
            <div class="completion-box">
              <p>
                연구에 관심을 가져주셔서 감사합니다.
              </p>
              <p>
                이제 창을 닫으셔도 됩니다.
              </p>
            </div>
          `);
        }
      }
    };

    const eligibility_failed = {
      timeline: [eligibility_failed_trial],
      conditional_function: function() {return !eligibility_passed;}
    };

    // Repeat
    const eligibility_loop = {
      timeline: [eligibility_check, eligibility_failed],
      loop_function: function() {return retry_eligibility;}
    };

    timeline.push(eligibility_loop);

    // Demographic information
    const demographics = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
        <div style="max-width:700px; margin:auto; text-align:center;">
          <h3>
            실험에 앞서 몇 가지 정보를 입력해주세요.
          </h3>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:auto;">
          <div style="margin:30px 0; text-align:center;">
            <p>
              <strong>1. 만 나이를 입력해 주세요.</strong>
            </p>
            <input type="number" name="age" min="18" max="120" required style="width:80px;padding:8px;font-size:16px;text-align:center;">
          </div>

          <div style="margin:30px 0; text-align:center;">
            <p>
              <strong>2. 성별을 선택해 주세요.</strong>
            </p>
            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="male" required>
              남성
            </label>

            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="female">
              여성
            </label>

            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="other">
              기타
            </label>

            <label>
              <input type="radio" name="gender"value="prefer_not_to_say">
              밝히고 싶지 않음
            </label>
          </div>
        </div>
      `,
      button_label: "계속",
      data: {phase: "demographics"},
      on_finish: function(data) {data.age = parseInt(data.response.age,10);data.gender = data.response.gender;}
    };
    timeline.push(demographics);

    // Instructions
    timeline.push({
      type: jsPsychInstructions,
      record_data: false,
      pages: [
        `
          <h2>
            실험에 참여해 주셔서 감사합니다!
          </h2>
          <p>
            이 실험에서는 그림을 본 후 주어진 문장에 대한 질문에 답해 주시면 됩니다.
          </p>
          <p>
            그림은 화살표를 사이에 두고 두 부분으로 나누어져 있습니다.
            화살표의 왼쪽은 처음 상태를, 오른쪽은 시간이 조금 지난 후의 상태를 나타냅니다.
          </p>
          <p>
            예를 들어, 아래 그림은 처음에는 우산이 접혀 있었지만 이후에는 우산이 펼쳐진 상황을 나타냅니다.
          </p>
          <img src="ex/umbrella_change.png" class="instruction-example-image">
          <p>
            반면 아래 그림은  처음과 이후의 상태가 동일하여, 아무런 변화 없이 우산이 그대로 접혀 있는 상황을 나타냅니다.
          </p>
          <img src="ex/umbrella_no_change.png" class="instruction-example-image">
        `,
        `
        <div class="instruction-box">
          <div class="instruction-highlight">
            <p>
              그림은 문장과 함께 쌍으로 제시됩니다.
            </p>
            <h3>
              예를 들어, 다음과 같은 화면을 보게 됩니다:
            </h3>
            <div class="inst-box">
              <img src="ex/umbrella_change.png" class="instruction-example-image">
              <p>
                <strong>우산 하나가 펴졌다.</strong>
              </p>
              <p>
                 주어진 문장이 상황을 자연스럽게 설명하고 있나요?
              </p>
            </div>
            <p>
              그림을 잘 살펴본 뒤, 아래에 제시되는 문장을 읽고 주어진 질문에 대해 <strong>예</strong> 혹은 <strong>아니오</strong>를 선택해 답해 주시면 됩니다. 
            </p>
            <p>
              위 예시의 경우, 문장이 상황을 자연스럽게 설명하므로 <strong>"예"</strong>를 선택하시면 됩니다.
            </p>
          </div>
        </div>
        `
      ],

      show_clickable_nav: true,
      button_label_previous: "이전",
      button_label_next: "다음"
    });

    // Begin Screen
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      record_data: false,
      stimulus: `
        <div class="begin-box">
          <p>이 실험은 정답을 맞히는 시험이 아닙니다. 본인의 자연스러운 판단에 따라 답해 주세요.</p>
          <p>별도의 시간 제한은 없지만 너무 오래 고민하지 마시고, 처음 읽었을 때의 느낌에 따라 선택해 주세요.</p>
          <p>준비가 되시면 아래의 "시작" 버튼을 클릭해 주세요.</p>
        </div>
      `,
      choices: ["시작"]
    });

    // Expreimental Trials
    // Randomly pair primes and targets
    // SUBJECT prime → SUBJECT target / OBJECT prime  → OBJECT target
    // Lexical pairing is randomized separately for each participant.

    function makeRandomPrimeTargetPairs() {
      const subject_primes =
        jsPsych.randomization.shuffle(
          window.EXP3_PRIMES.filter(prime => prime.qp_position === "subject")
        );
      const object_primes =
        jsPsych.randomization.shuffle(
          window.EXP3_PRIMES.filter(prime => prime.qp_position === "object")
        );
      const subject_targets =
        jsPsych.randomization.shuffle(
          window.EXP3_TARGETS.filter(target => target.qp_position === "subject")
        );
      const object_targets =
        jsPsych.randomization.shuffle(
          window.EXP3_TARGETS.filter(target => target.qp_position === "object")
        );

      // Safety checks
      if (subject_primes.length !== subject_targets.length) 
      {throw new Error("The number of SUBJECT primes and SUBJECT targets must match.");}

      if (object_primes.length !== object_targets.length) 
      {throw new Error("The number of OBJECT primes and OBJECT targets must match.");}

      const pairs = [];
      // Subject-QP pairs
      subject_targets.forEach(
        (target, i) => {
          pairs.push({
            prime: subject_primes[i],
            target: target
          });
        }
      );
      // Object-QP pairs
      object_targets.forEach(
        (target, i) => {
          pairs.push({
            prime: object_primes[i],
            target: target
          });
        }
      );
      // Randomize order of prime-target pairs
      return (jsPsych.randomization.shuffle(pairs));
    }

    const experimental_pairs =
      makeRandomPrimeTargetPairs();

    // Prime Trial
    function makePrimeTrial(pair) {
      const prime = pair.prime;
      // Which prime sentence this participant sees
      const prime_sentence = 
        prime_group === "inverse"
          ? prime.inverse_sentence
          : prime.control_sentence;
      return {
        type: jsPsychHtmlButtonResponse,
        save_trial_parameters: {stimulus: false},
        stimulus: `
          <div class="trial-card">
            <div class="picture-section">
              <img class="experiment-image" src="${prime.image}">
            </div>
            <div class="target-box">
              <p class="target-sentence">
                ${prime_sentence}
              </p>
            </div>
            <p class="trial-question">
              주어진 문장이 상황을 자연스럽게 설명하고 있나요?
            </p>
          </div>
        `,
        choices: response_buttons,
        css_classes: ["experiment-stage", "prime-stage"],
        data: {
          subject_id: subject_id,
          experiment: "Exp3",
          assignment_cell: assignment_cell,
          prime_group: prime_group,
          yes_no_order: response_buttons.join("|"),
          trial_role: "prime",
          prime_id: prime.id,
          qp_position: prime.qp_position,
          sentence: prime_sentence,
          image: prime.image,
          // Both prime versions should be true of the prime picture.
          correct_response: "예",
          // Record which target happens to follow this prime for this participant.
          paired_target_id: pair.target.id,
        },

        on_finish:
          function(data) {
            const selected_label = response_buttons[data.response];
            data.response_label = selected_label;
            data.response_binary =
              selected_label === "예"
                ? "yes"
                : "no";
            data.correct =
              selected_label === data.correct_response;
          }
      };
    }

   // Target Trial
    function makeTargetTrial(pair) {
      const prime = pair.prime;
      const target = pair.target;
      const prime_sentence =
        prime_group === "inverse"
          ? prime.inverse_sentence
          : prime.control_sentence;
      return {
        type: jsPsychHtmlButtonResponse,
        save_trial_parameters: {stimulus: false},
        stimulus: `
          <div class="trial-card">
            <div class="picture-section">
              <img class="experiment-image" src="${target.image}">
            </div>
            <div class="target-box">
              <p class="target-sentence">
                ${target.sentence}
              </p>
            </div>
            <p class="trial-question">
              주어진 문장이 상황을 자연스럽게 설명하고 있나요?
            </p>
          </div>
        `,
        choices: response_buttons,
        css_classes: ["experiment-stage", "target-stage"],
        data: {
          subject_id: subject_id,
          experiment: "Exp3",
          assignment_cell: assignment_cell,
          prime_group: prime_group,
          yes_no_order: response_buttons.join("|"),
          trial_role: "target",
          target_id: target.id,
          qp_position: target.qp_position, 
          sentence: target.sentence,
          image: target.image,
          // Record exactly which randomly paired prime preceded this target.
          preceding_prime_id: prime.id,
          preceding_prime_sentence: prime_sentence
        },

        on_finish:
          function(data) {
            const selected_label = response_buttons[data.response];
            data.response_label = selected_label;
            data.response_binary =
              selected_label === "예"
                ? "yes"
                : "no";
            // Critical target: YES = inverse reading accepted / NO  = inverse reading not accepted
            data.inverse_acceptance =
              selected_label === "예"
                ? 1
                : 0;
          }
      };
    }

    // Add Prime → Target Sequences
    experimental_pairs.forEach(pair => {
        timeline.push(makePrimeTrial(pair));
        timeline.push(makeTargetTrial(pair)
        );
      }
    );

    // Payment contact
    const payment_contact = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
        <div style="max-width:700px; margin:auto; text-align:center;">
          <h3>
            참여 보상 지급을 위한 계좌 정보
          </h3>
          <p>
            참여 보상 지급을 위해
            계좌번호를 입력해 주세요.
          </p>
          <p style="font-size:15px; color:#64748b;">
            입력하신 정보는 보상 지급 이외의 용도로
            사용되지 않으며, 목적 달성 후 즉시 폐기됩니다.
          </p>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:30px auto; text-align:center;">
          <p>
            <strong>계좌 번호</strong>
          </p>
          <input type="tel" name="account_number" placeholder="우리 / 1002-012-56789" required
            style="width:200px;padding:10px;font-size:18px;text-align:center;">
        </div>
      `,
      button_label: "제출",
      data: {
        phase: "payment_contact",
        subject_id: subject_id
      },
      on_finish: function(data) {
        data.account_number = data.response.account_number.trim();
      }
    };

    timeline.push(payment_contact);

    // ============================================================
    // LOCAL DEBUG: DOWNLOAD CSV
    // Delete this section before launching the real experiment.
    // ============================================================

    function downloadLocalCSV() {
      const csv =
        "\uFEFF" +
        jsPsych.data.get().csv();

      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href =
        url;

      link.download =
        `exp3_${subject_id}.csv`;

      document.body.appendChild(
        link
      );

      link.click();

      document.body.removeChild(
        link
      );

      URL.revokeObjectURL(
        url
      );
    }

    const local_download = {
      type:
        jsPsychHtmlButtonResponse,
      record_data: false,
      stimulus: `
        <div class="saving-box">
          <h2>
            Local test mode
          </h2>
          <p>
            아래 버튼을 눌러 현재 실험 데이터를
            CSV 파일로 저장해 주세요.
          </p>
        </div>
      `,
      choices: [
        "CSV 다운로드"
      ],

      on_finish:
        function() {
          downloadLocalCSV();
        }
    };

    timeline.push(local_download);

  // Completion Screen
  timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="completion-box">
      <h2>
        응답이 저장되었습니다.
      </h2>
      <p>
        이제 창을 닫으셔도 됩니다.
      </p>
      <h3>
        참여해 주셔서 감사합니다!
      </h3>
    </div>
  `,
  choices: "NO_KEYS",
  data: {phase: "completion"}
  });

  jsPsych.run(timeline);
</script>
</body>
</html>
