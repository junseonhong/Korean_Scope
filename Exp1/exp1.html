<body>
  <script>
    // Initialize jsPsych
    const jsPsych = initJsPsych({
     show_progress_bar: true,
      // on_finish: function() {
      //   jsPsych.data.displayData();
      // }
    });

    const DATAPIPE_EXPERIMENT_ID = "DpvkvDr9rv2q";

    const subject_id = jsPsych.randomization.randomID(10);

    // Randomly assign participant to one of 16 counterbalancing cells:
    // 8 stimulus lists × 2 Yes/No button orders
    const assignment_cell = Math.floor(Math.random() * 16);

    // Assign one of the 8 experimental lists
    const list_number = (assignment_cell % 8) + 1;

    // Independently counterbalance button order
    const response_buttons =
      assignment_cell < 8
        ? ["예", "아니요"]
        : ["아니요", "예"];

    jsPsych.data.addProperties({
      subject_id: subject_id,
      list_number: list_number,
      yes_no_order: response_buttons.join("|")
    });

    //Store each trial in a list called timeline 
    const timeline = [];

    // Consent language shown by default
let consent_language = "ko";

// Consent
const consent = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
    <div class="consent">

      <!-- Language selection -->
      <div style="text-align: center; margin-bottom: 30px;">
        <button
          type="button"
          id="show-korean"
          style="padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer;">
          한국어
        </button>

        <button
          type="button"
          id="show-english"
          style="padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer;">
          English
        </button>
      </div>


      <!-- KOREAN VERSION -->
      <div id="consent-korean">

        <p>연구책임자: 홍준선</p>
        <p>연구 제목: Behavioral Study of Language Comprehension and Interpretation</p>
        <p>IRB 번호: XXXXX</p>

        <p style="text-align: center;">
          <strong>연구 관련 문의</strong>
        </p>
       
        <p style="text-align: center;">
          홍준선, 450 Jane Stanford Way Building 460 Rm. 127, STANFORD, CA, 1-650-723-4284
        </p>

        <p style="text-align: center;">
          <strong>연구 개요</strong>
        </p>

        <p>
          귀하는 언어와 의사소통에 관한 연구에 참여하도록 안내받았습니다.
          본 연구의 목적은 사람들이 다양한 맥락에서 문장을 어떻게 사용하고 해석하는지 이해하는 것입니다.
          귀하는 짧은 문장을 읽거나 그림을 본 후, 제시된 문장을 해석하고 그 문장이 얼마나 자연스러운지 판단하게 됩니다.
          본 연구 참여는 참여는 자발적이며, 귀하는 언제든지 참여 동의를 철회하실 수 있습니다. 
        </p>


        <p style="text-align: center;">
          <strong>소요 시간</strong>
        </p>

        <p>
          연구 참여에는 약 20분이 소요됩니다.
        </p>

        <p style="text-align: center;">
          <strong>참여 보상</strong>
        </p>

        <p>
          연구 참여에 대한 보상으로 5,000원을 지급받게 됩니다.
        </p>

        <p style="text-align: center;">
          <strong>개인정보 및 비밀유지</strong>
        </p>

        <p>
          본 연구 참여로 인해 발생할 수 있는 위험은 낮습니다.
          귀하의 응답 내용은 외부에 공개되지 않으며, 연구진은 귀하의 개인정보를 보호하기 위한 절차를 마련하고 있습니다.
          본 연구 결과를 바탕으로 작성되는 보고서나 논문 등의 자료에는 귀하를 식별할 수 있는 정보가 포함되지 않습니다.
        </p>

         <p style="text-align: center;">
          <strong>연락처</strong>
        </p>

        <p>
          <strong>연구 관련 문의:</strong>
          연구 내용이나 절차, 연구 참여로 인한 위험 및 이점에 대한 질문, 혹은 연구와 관련된 우려 또는 불만 사항이 있는 경우 연구책임자인 홍준선 (junseonh@stanford.edu, 1-650-723-4284)에게 연락하시기 바랍니다. 
        </p>

        <p style="text-align: center;">
          <strong>독립적인 문의처</strong>
        </p>

        <p>
          연구의 진행 방식에 만족하지 못하거나, 연구 참여자로서의 권리에 대한 우려, 불만 혹은 일반적인 질문이 있는 경우,
          연구진과 독립적인 담당자와 상담하기 위해 Stanford Institutional Review Board (IRB)에 
          650-723-2480 또는 수신자 부담 전화 1-866-680-2906를 통해 연락하실 수 있습니다.
          또한 irbnonmed@stanford.edu로 Stanford IRB에 이메일을 보낼 수 있습니다.
        </p>

        <p>
          기록을 위해 이 페이지를 저장하거나 인쇄해 두시기 바랍니다.
        </p>

        <h3>
          연구 참여에 동의하시는 경우, 아래의 “동의하고 계속 / Agree and Continue” 를 클릭해 주십시오.
        </h3>

      </div>


      <!-- ENGLISH VERSION -->
      <div id="consent-english" style="display: none;">

        <p>Protocol Director: Junseon Hong</p>
        <p>Protocol Title: Behavioral Study of Language Comprehension and Interpretation</p>
        <p>IRB# XXXXX</p>

        <p style="text-align: center;">
          <strong>FOR QUESTIONS ABOUT THE STUDY, CONTACT</strong>
        </p>
       
        <p style="text-align: center;">
          Junseon Hong, 450 Jane Stanford Way, Building 460, Rm. 127, STANFORD, CA, 1-650-723-4284
        </p>
        
        <p style="text-align: center;">
          <strong>DESCRIPTION</strong>
        </p>

        <p>
          You are invited to participate in a research study on language and communication.
          The purpose of this research is to understand how people use and interpret sentences in different contexts.
          You will be asked to read short contexts or view pictures and make judgments about sentences based on how you interpret them and what sounds natural to you.
          Participation in this research is voluntary, and you are free to withdraw your consent at any time. 
        </p>

        <p style="text-align: center;">
          <strong>TIME INVOLVEMENT</strong>
        </p>

        <p>
          Your participation will take approximately 20 minutes.
        </p>

        <p style="text-align: center;">
          <strong>PAYMENTS</strong>
        </p>

        <p>
          You will receive 5,000 Korean Won as payment for your participation.
        </p>

        <p style="text-align: center;">
          <strong>PRIVACY AND CONFIDENTIALITY</strong>
        </p>

        <p>
          The risks associated with this study are low. 
          Your answers will be kept confidential. 
          We have procedures to protect your privacy, and your identity will not be included in written materials resulting from the study.
        </p>

         <p style="text-align: center;">
          <strong>CONTACT INFORMATION</strong>
        </p>

        <p>
          <strong>Questions:</strong>
          If you have any questions, concerns or complaints about this research, its procedures, risks and benefits, contact the Protocol Director,
          Junseon Hong, junseonh@stanford.edu, 1-650-723-4284. 
        </p>

        <p style="text-align: center;">
          <strong>INDEPENDENT CONTACT</strong>
        </p>

        <p>
          If you are not satisfied with how this study is being conducted, or if you have any concerns, complaints, 
          or general questions about the research or your rights as a participant, contact the Stanford Institutional Review Board (IRB) 
          to speak to someone independent of the research team at 650-723-2480 or toll free at 1-866-680-2906. 
          You can also write to the Stanford IRB at irbnonmed@stanford.edu.
        </p>

        <p>
          Please save or print a copy of this page for your records.
        </p>

        <h3>
          If you agree to participate in this research,
          please click “동의하고 계속 / Agree and Continue” below.
        </h3>

      </div>

    </div>
  `,

  choices: ["동의하고 계속 / Agree and Continue"],

  data: {
    phase: "consent"
  },

  on_load: function() {

    const korean = document.getElementById("consent-korean");
    const english = document.getElementById("consent-english");

    const koreanButton = document.getElementById("show-korean");
    const englishButton = document.getElementById("show-english");

    // Korean Ver.
    koreanButton.addEventListener("click", function() {
      korean.style.display = "block";
      english.style.display = "none";

      consent_language = "ko";
    });

    // English Ver.
    englishButton.addEventListener("click", function() {
      korean.style.display = "none";
      english.style.display = "block";

      consent_language = "en";
    });
  },

  on_finish: function(data) {
    data.consent_language = consent_language;
  }
};

timeline.push(consent);

    // Instructions
    const instructions= {
      type: jsPsychInstructions,
      pages: [`
        <div class="content">
          <h2>실험에 참여해주셔서 감사드립니다!</h2><br>
          <div class="inst-box">
          <p>이 실험에서는 두개의 문장을 읽게 됩니다.</p>
          <p>두 문장을 순서대로 읽었을 때, 의미가 자연스럽게 이해되는지 판단해 주세요.</p>
          <p>자연스럽다고 생각하면 <strong>“예”</strong>, 그렇지 않다고 생각하면 <strong>“아니요”</strong>를 선택해 주세요.</p>
          <p>너무 오래 고민하지 마시고, 처음 읽었을때의 느낌이 얼마나 자연스러운지에 따라 답변해 주세요.</p>
          </div>
        </div>
        `,
     `
        
          <h3>예를 들어,</h3>
        <div class="inst-box">
          <p style="font-size: 22px;font-weight: 500;">
            민수가 지수를 도와주었다.
            다시 말해, 지수는 민수에게 도움을 받았다.
          </p>
        </div>
        
          <p style="margin-top:28px;">
            <h3>이 경우 두 번째 문장은 첫 번째 문장을 자연스럽게 다시 말한 것이므로
            <strong>“예”</strong>를 선택합니다.</h3>
          </p>
        `
      ],
      show_clickable_nav: true,
      button_label_previous: "이전",
      button_label_next: "다음",
      data: { phase: "instructions" }
    };

    timeline.push(instructions);

    timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="begin-box">
        <p>준비가 되시면 아래의 버튼을 눌러 시작해주세요.</p> 
        <p>별도의 시간제한은 없습니다.</p>
      </div>
    `,
    choices: ["시작"],
    data: { phase: "begin_main" }
  });

    //Run the experiment 
    function makeMeaningTrial(item) {
    return {
      type: jsPsychHtmlButtonResponse,

      stimulus: `
      <div class="trial-card">

        <div class="sentence-box">
          <p class="target-sentence">${item.sentence}</p> <p class="probe-sentence">다시 말해, ${item.probe}</p>
        </div>

        <p class="trial-question">
          두 문장이 자연스럽게 연결되나요?
        </p>

      </div>
    `,

      choices: response_buttons,

      data: {
        item_id: item.id,
        item_type: item.trial_type,
        sentence: item.sentence,
        probe: item.probe,
        // Add these variables only when they exist
        ...(item.filler_type != null
          ? { filler_type: item.filler_type }
          : {}),

        ...(item.qp_position != null
          ? { qp_position: item.qp_position }
          : {}),

        ...(item.negation_form != null
          ? { negation_form: item.negation_form }
          : {}),

        ...(item.probe_type != null
          ? { probe_type: item.probe_type }
          : {}),

        ...(item.expected_response != null
          ? { expected_response: item.expected_response }
          : {})
      },

      on_finish: function(data) {
        const selected_label = response_buttons[data.response];

        data.response_label = selected_label;
        data.response_binary = selected_label === "예" ? "yes" : "no";

         // correct answer - fillers and attention checks
        if (data.expected_response !== undefined) {

        data.correct =
          data.response_binary === data.expected_response;
        }

        // Remove jsPsych fields that are not needed
        delete data.rt;
        delete data.stimulus;
        delete data.response;
        delete data.trial_type;
        delete data.trial_index;
        delete data.plugin_version;
        delete data.time_elapsed;
        }
    };
  }

  const experimental_conditions = [
    { qp_position: "object",  negation_form: "LFN", probe_type: "surface" },
    { qp_position: "object",  negation_form: "LFN", probe_type: "inverse" },
    { qp_position: "object",  negation_form: "SFN", probe_type: "surface" },
    { qp_position: "object",  negation_form: "SFN", probe_type: "inverse" },
    { qp_position: "subject", negation_form: "LFN", probe_type: "surface" },
    { qp_position: "subject", negation_form: "LFN", probe_type: "inverse" },
    { qp_position: "subject", negation_form: "SFN", probe_type: "surface" },
    { qp_position: "subject", negation_form: "SFN", probe_type: "inverse" }
  ];

  // CHECK - loading stimulus file
  if (
    !Array.isArray(window.EXP1_STIMULI) ||
    !Array.isArray(window.EXP1_FILLERS) ||
    !Array.isArray(window.EXP1_ATTENTION)
  ) {
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="error-box">
          <h2>Stimulus file not loaded</h2>

          <p>
            <code>stims.js</code> must define:
          </p>

          <p>
            <code>window.EXP1_STIMULI</code><br>
            <code>window.EXP1_FILLERS</code><br>
            <code>window.EXP1_ATTENTION</code>
          </p>
        </div>
      `,
      choices: "NO_KEYS"
    });
  } else {

  // 1. Select 32 targets:
  // Each participant sees: 32 targets
  // 4 OBJ LFN surface
  // 4 OBJ LFN inverse
  // 4 OBJ SFN surface
  // 4 OBJ SFN inverse
  // 4 SUBJ LFN surface
  // 4 SUBJ LFN inverse
  // 4 SUBJ SFN surface
  // 4 SUBJ SFN inverse

  const selected_targets = window.EXP1_STIMULI.filter(stim => {

  // Items 1–8 start in the 8 different conditions. Items 9–16 repeat that pattern,....
  const base_condition = (stim.item - 1) % 8;

  // Move the item to the next condition on each experimental list.
  const condition_index =
    (base_condition + (list_number - 1)) % 8;
  const required_condition =
    experimental_conditions[condition_index];
  return (
    stim.qp_position === required_condition.qp_position &&
    stim.negation_form === required_condition.negation_form &&
    stim.probe_type === required_condition.probe_type
  );
  });

  // 2. Select balanced fillers: 16 fillers
  // 4 F1
  // 4 F2
  // 4 F3
  // 4 F4
  // Within every filler family: 2 TRUE probes & 2 FALSE probes
  // F1 additionally contains: subject LFN, subject SFN, object LFN, object SFN
  // F2–F4: 2 subject & 2 object
  
  // Helper: find one exact filler
  function findFiller(
    filler_type,
    item_number,
    position,
    negation_form,
    probe_type
  ) {
    return window.EXP1_FILLERS.find(filler => {
      return (
        filler.filler_type === filler_type
        &&
        filler.item === item_number
        &&
        filler.qp_position === position
        &&
        filler.negation_form === negation_form
        &&
        filler.probe_type === probe_type
      );
    });
  }

  // F1
  // One item from each structural condition: Probe polarity alternates across slots & Lexical set is used rotates across lists
  const f1_slots = [
    {
      position: "subject",
      negation: "LFN"
    },
    {
      position: "subject",
      negation: "SFN"
    },
    {
      position: "object",
      negation: "LFN"
    },
    {
      position: "object",
      negation: "SFN"
    }
  ];

  const selected_F1 =
    f1_slots.map((slot, index) => {
      // Rotate lexical sets 1–6 across experimental lists
      const item_number =
        ((list_number - 1 + index) % 6) + 1;
      // Exactly 2 true + 2 false
      const probe_type =
        (index + list_number) % 2 === 0
          ? "true"
          : "false";
      return findFiller(
        "F1",
        item_number,
        slot.position,
        slot.negation,
        probe_type
      );
    });

  // F2, F3, F4
  // For each family:
  // 2 subject
  // 2 object
  // 2 true
  // 2 false

  function selectFourFromFillerFamily(filler_type) {
    const positions = [
      "subject",
      "subject",
      "object",
      "object"
    ];
    return positions.map((position, index) => {
      // Rotate lexical sets 1–6 across lists
      const item_number =
        ((list_number - 1 + index) % 6) + 1;
      // Exactly 2 true and 2 false
      const probe_type =
        (index + list_number) % 2 === 0
          ? "true"
          : "false";
      return findFiller(
        filler_type,
        item_number,
        position,
        null,
        probe_type
      );
    });
    }

    const selected_F2 =
      selectFourFromFillerFamily("F2");

    const selected_F3 =
      selectFourFromFillerFamily("F3");

    const selected_F4 =
      selectFourFromFillerFamily("F4");

    const selected_fillers = [
      ...selected_F1,
      ...selected_F2,
      ...selected_F3,
      ...selected_F4
    ];

  // 3. Select 4 attention checks: 2 expected YES & 2 expected NO
  // Prevent the same base attention item from occurring twice.
  const attention_true =
    window.EXP1_ATTENTION.filter(
      item => item.expected_response === "yes"
    );
  const attention_false =
    window.EXP1_ATTENTION.filter(
      item => item.expected_response === "no"
    );

  // Randomly choose 2 YES attention checks
  const selected_attention_true =
    jsPsych.randomization.sampleWithoutReplacement(
      attention_true,
      2
    );

  // Avoid selecting another version of the same base item
  const used_attention_items =
    selected_attention_true.map(
      item => item.item
    );

  const available_attention_false =
    attention_false.filter(
      item =>
        !used_attention_items.includes(item.item)
    );

  // Randomly choose 2 NO attention checks
  const selected_attention_false =
    jsPsych.randomization.sampleWithoutReplacement(
      available_attention_false,
      2
    );
  const selected_attention = [

    ...selected_attention_true,
    ...selected_attention_false

  ];
  
  //Combine trials with constrained randomization (32 targets, 16 fillers, 4 attention checks)
  // Every filler/attention trial is separated from the next
  // filler/attention trial by at least one target.
  
  // Randomize targets
  const randomized_targets =
    jsPsych.randomization.shuffle(
      selected_targets
    );

  // Combine fillers + attention checks
  const non_targets = [
    ...selected_fillers,
    ...selected_attention
  ];

  // Randomize fillers + attention checks
  const randomized_non_targets =
    jsPsych.randomization.shuffle(
      non_targets
    );

  // 33 possible gaps around 32 targets: Put each non-target into a different gap.
  // Guarantees that two non-target trials can never appear consecutively.
  const possible_gaps =
    Array.from(
      { length: randomized_targets.length + 1 },
      (_, index) => index
    );

  const selected_gaps =
    jsPsych.randomization.sampleWithoutReplacement(
      possible_gaps,
      randomized_non_targets.length
    );

  // Associate one non-target trial with each selected gap
  const gap_trials = {};
  selected_gaps.forEach((gap, index) => {
    gap_trials[gap] =
      randomized_non_targets[index];
  });
  // Build the final trial sequence
    const randomized_trials = [];
    for (
      let i = 0;
      i <= randomized_targets.length;
      i++
    ) 
    {
    // Add a filler/attention check if this gap was selected
    if (gap_trials[i] !== undefined) {
      randomized_trials.push(
        gap_trials[i]
      );
    }
    // Then add the next target
    if (i < randomized_targets.length) {
      randomized_trials.push(
        randomized_targets[i]
      );
    }
    }

    // Add all 52 trials to timeline
    randomized_trials.forEach(item => {
      timeline.push( 
        makeMeaningTrial(item)
      );
    });

function buildExperimentCSV() {

const relevant_data =
  jsPsych.data
    .get()
    .filterCustom(data =>
      data.item_type === "target"
      ||
      data.item_type === "filler"
      ||
      data.item_type === "attention"
    );


// Exact CSV column order
const columns = [
  "subject_id",
  "list_number",
  "item_id",
  "item_type",
  "filler_type",
  "qp_position",
  "negation_form",
  "probe_type",
  "sentence",
  "probe",
  "yes_no_order",
  "expected_response",
  "response_label",
  "response_binary",
  "correct"
];


function escapeCSV(value) {

  if (
    value === undefined
    ||
    value === null
  ) {
    return "";
  }

  const stringValue =
    String(value);

  return `"${stringValue.replace(
    /"/g,
    '""'
  )}"`;
}


const rows =
  relevant_data.values();


const header =
  columns.join(",");


const body =
  rows
    .map(row =>
      columns
        .map(column =>
          escapeCSV(
            row[column]
          )
        )
        .join(",")
    )
    .join("\n");


// UTF-8 BOM + CSV
return header + "\n" + body;
}
