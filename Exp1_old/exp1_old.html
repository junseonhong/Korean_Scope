<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 1</title>
  <!-- Load JsPsych -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  <script src="stims_exp1.js"></script>
  
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!--Load Font-->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* General page */
    body,
    .jspsych-content,
    .jspsych-content-wrapper {
      font-family: 'Noto Sans KR', sans-serif;
    }
  
    body {
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
  
    .jspsych-content-wrapper {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  
    h1,
    h2,
    h3 {
      color: #2c3e50;
    }
  
    p {
      font-size: 18px;
      line-height: 1.6;
    }
  
    /* jsPsych buttons */
    .jspsych-btn {
      font-size: 14px;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 8px;
      background-color: #64748b;
      color: white;
      border: none;
      cursor: pointer;
    }
  
    .jspsych-btn:hover {
      background-color: #475569;
    }
  
    /* Consent */
    .jspsych-content .consent p {
      font-size: 16px;
      line-height: 1.4;
      text-align: justify;
    }
  
    .jspsych-content .consent h3 {
      font-size: 18px;
      line-height: 1.4;
    }
  
  
    /* Instructions */
    .content {
      margin-top: 20px;
    }
  
    .example-box {
      background: paleturquoise;
      padding: 12px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .example-screen {
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      background-color: white;
      border: 1px solid #dbe3ea;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
  
    .jspsych-instructions-nav {
      margin-top: 30px;
      text-align: center;
    }

    .inst-box{
      background-color: lemonchiffon;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }  

    .jspsych-content .sentence-label {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
  
    /* Start screen */
  
    .begin-box {
      background-color: #e0f2fe;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    /* ---------- Experimental trials ---------- */
  
    .trial-card {
      max-width: 750px;
      margin: 0 auto;
      text-align: center;
    }
  
    .trial-label {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }
  
    .sentence-box {
      background-color: #f8fafc;
      padding: 20px 25px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
 
    .meaning-arrow {
      font-size: 28px;
      margin: 15px 0;
      color: #64748b;
    }

    .reformulation-marker {
      font-size: 18px;
      font-weight: 600;
      margin: 22px 0;
      color: #64748b;
}
  
    .trial-question {
      font-size: 19px;
      font-weight: 500;
      margin-top: 30px;
    }

    /* ---------- Local test / saving ---------- */
  
    .saving-box {
      background-color: #ecfdf5;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }
  
    .saving-box h2 {
      margin-top: 0;
      color: #047857;
    }
  
  
    /* ---------- Completion ---------- */
  
    .completion-box {
      background-color: #f0fdf4;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }
  
    .completion-box h2 {
      margin-top: 0;
      color: #15803d;
    }
  
  
    /* ---------- Error screen ---------- */
  
    .error-box {
      padding: 30px;
      text-align: center;
    }
  
  
    /* Progress bar */
  
    #jspsych-progressbar-container {
      background-color: #f3f7f4;
      padding: 10px 0;
      margin-bottom: 20px;
    }

    #jspsych-progressbar-outer {
      width: 90%;
      margin: 0 auto;
      height: 12px;
      background-color: #dfe9e2;
      border-radius: 8px;
      overflow: hidden;
    }

    #jspsych-progressbar-inner {
      height: 100%;

      /* light green → darker green */
      background: linear-gradient(
        90deg,
        #b7d9c2 0%,
        #74b68b 55%,
        #3f8f5f 100%
      );

      transition: width 0.4s ease;
      border-radius: 8px;

  /* subtle shaded effect */
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.45);
  }
  #jspsych-survey-html-form-next {
    display: block;
    margin: 30px auto 0 auto;
  }
  </style>

</head>
<body>
  <script>
    // Initialize jsPsych
    const jsPsych = initJsPsych({
      show_progress_bar: true,
      message_progress_bar: ""
    });

    const DATAPIPE_EXPERIMENT_ID = "DpvkvDr9rv2q";

    const subject_id = jsPsych.randomization.randomID(10);

    // Randomly assign participant to one of 16 counterbalancing cells:
    // 8 stimulus lists × 2 Yes/No button orders
    const assignment_cell = Math.floor(Math.random() * 16);

    // Assign one of the 8 experimental lists
    const list_number = (assignment_cell % 8) + 1;

    // Independently counterbalance button order
    const response_buttons =
      assignment_cell < 8
        ? ["예", "아니오"]
        : ["아니오", "예"];

    //Store each trial in a timeline 
    const timeline = [];

    // Consent
    const consent = {
      type: jsPsychHtmlButtonResponse,
      record_data: false,
      stimulus: `
        <div class="consent">
          <h2 style="text-align:center;">
            연구 참여 안내 및 동의
          </h2>
          <h3 style="text-align:center;">
            언어 이해 및 해석에 관한 행동 연구
          </h3>
          <p style="text-align: center;">
            <strong>연구 개요</strong>
          </p>
          <p>
            귀하는 언어와 의사소통에 관한 연구에 참여하도록 요청받았습니다.
            본 연구의 목적은 사람들이 다양한 맥락에서 문장을 어떻게 사용하고 해석하는지 이해하는 것입니다.
            귀하는 짧은 문장들을 읽고, 제시된 문장들이 의미상 얼마나 자연스럽게 이어지는지 판단하게 됩니다.
            본 연구 참여는 자발적이며, 언제든지 연구 참여를 중단하실 수 있습니다. 연구에 참여하지 않거나 참여를 중단하더라도 어떠한 불이익도 없습니다.
          </p>
          <p style="text-align: center;">
            <strong>소요 시간</strong>
          </p>
          <p>
            연구 참여에는 약 15분이 소요될 예정입니다.
          </p>
          <p style="text-align: center;">
            <strong>참여 보상</strong>
          </p>
          <p>
            연구 참여에 대한 보상으로 5,000원을 지급해 드립니다. 실험 종료 후, 보상 지급을 위해 계좌 정보를 수집할 예정입니다. 
            해당 정보는 보상 지급 이외의 용도로 사용되지 않으며, 목적 달성 후 즉시 폐기됩니다.
          </p>
          <p style="text-align: center;">
            <strong>개인정보 및 비밀유지</strong>
          </p>
          <p>
            본 연구 참여로 인해 발생할 수 있는 일상생활에서 일반적으로 경험하는 수준을 넘어서는 알려진 위험은 없습니다.
            귀하의 응답 내용은 외부에 공개되지 않으며, 성별 나이 등의 개인정보는 식별 불가능하게 처리되어 관련 규정에 의해 보호됩니다.
            본 연구 결과를 바탕으로 작성되는 보고서나 논문 등의 자료에는 귀하를 식별할 수 있는 정보가 포함되지 않습니다.
          </p>
          <p style="text-align: center;">
            <strong>연구 관련 문의:</strong>
          </p>
          <p>
            연구 내용이나 절차, 연구 참여로 인한 위험 및 이점에 대한 질문, 혹은 연구와 관련된 우려 또는 불만 사항이 있는 경우 연구책임자인 홍준선 (junseonh@stanford.edu, 1-650-723-4284)에게 연락하시기 바랍니다. 
          </p>
          <h3>
            연구 참여에 동의하시는 경우, 아래의 “동의하고 계속”을 클릭해 주십시오.
          </h3>
       </div>
      `,
      choices: ["동의하고 계속"],
    };

    timeline.push(consent);

    // Eligibility
    let eligibility_passed = false;
    let retry_eligibility = false;
    const eligibility_check = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
        <div style="max-width:700px; margin:auto; text-align:center;">
          <h3>
            연구 참여에 동의해주셔서 감사합니다.
          </h3>
          <h3>
            본 연구의 대상은 만 18세 이상의 한국어 화자입니다.
          </h3>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:auto;">
          <div style="margin:30px 0;">
            <p style="text-align:center;">
              <strong>
                1. 만 18세 이상이신가요?
              </strong>
            </p>
            <div style="text-align:center;">
              <label style="margin-right:25px;">
                <input type="radio" name="age_18" value="yes" required>
                예
              </label>
              <label>
                <input type="radio" name="age_18" value="no">
                아니오
              </label>
            </div>
          </div>
          <div style="margin:30px 0;">
            <p style="text-align:center;">
              <strong>
                2. 어린 시절부터 한국어를 자연스럽게 습득하셨나요?
              </strong>
            </p>
            <div style="text-align:center;">
              <label style="margin-right:25px;">
                <input type="radio" name="native_korean" value="yes" required>
                예
              </label>
              <label>
                <input type="radio" name="native_korean" value="no">
                아니오
              </label>
            </div>
          </div>
        </div>
      `,
      button_label: "계속",
      data: {phase: "eligibility"},
      on_finish: function(data) {
        eligibility_passed =
          data.response.age_18 === "yes" &&
          data.response.native_korean === "yes";
        retry_eligibility = false;
      }
    };
   
    // Ineligible Screen
    const eligibility_failed_trial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="completion-box">
          <p>
            죄송하지만 본 연구의 참여 조건에 해당하지 않습니다.
          </p>
          <p>
            응답을 잘못 선택하셨다면
            <strong>“다시 확인하기”</strong>를 눌러 주세요.
          </p>
          <p>
            관심을 가져주셔서 감사합니다.
          </p>
        </div>
      `,
      choices: [
        "다시 확인하기",
        "실험 종료"
      ],
      on_finish: function(data) {
        if (data.response === 0) {
          retry_eligibility = true;
        } else {
          jsPsych.abortExperiment(`
            <div class="completion-box">
              <p>
                연구에 관심을 가져주셔서 감사합니다.
              </p>

              <p>
                이제 창을 닫으셔도 됩니다.
              </p>
            </div>
          `);
        }
      }
    };

    const eligibility_failed = {
      timeline: [eligibility_failed_trial],
      conditional_function: function() {
        return !eligibility_passed;
      }
    };

    // Repeat
    const eligibility_loop = {
      timeline: [eligibility_check, eligibility_failed],
      loop_function: function() {return retry_eligibility;}
    };

    timeline.push(eligibility_loop);

    // Demographic information
    const demographics = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
        <div style="max-width:700px; margin:auto; text-align:center;">
          <h3>
            실험에 앞서, 몇가지 정보를 입력해주세요.
          </h3>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:auto;">
          <div style="margin:30px 0; text-align:center;">
            <p>
              <strong>1. 만 나이를 입력해 주세요.</strong>
            </p>
            <input type="number" name="age" min="18" max="120" required style="width:80px;padding:8px;font-size:16px;text-align:center;">
          </div>
          <div style="margin:30px 0; text-align:center;">
            <p>
              <strong>2. 성별을 선택해 주세요.</strong>
            </p>
            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="male" required>
              남성
            </label>
            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="female">
              여성
            </label>
            <label style="margin-right:20px;">
              <input type="radio" name="gender" value="other">
              기타
            </label>
            <label>
              <input type="radio" name="gender"value="prefer_not_to_say">
              밝히고 싶지 않음
            </label>
          </div>
        </div>
      `,
      button_label: "계속",
      data: {phase: "demographics"},
      on_finish: function(data) {data.age = parseInt(data.response.age,10);data.gender = data.response.gender;}
    };
    timeline.push(demographics);

    // Instructions
    const instructions= {
      type: jsPsychInstructions,
      record_data: false,
      pages: [`
        <div class="content">
          <h2>실험에 참여해주셔서 감사합니다!</h2><br>
          <div class="inst-box">
            <p>이 실험에서는 두개의 문장을 읽게 됩니다.</p>
            <p>문장들을 읽은 후, 두 번째 문장이 첫 번째 문장과 <strong>같은 의미를 자연스럽게 다시 표현한 것인지</strong> 판단해 주세요.</p>
            <p>자연스럽게 다시 표현한 것이라고 생각하면 <strong>“예”</strong>, 그렇지 않다고 생각하면 <strong>“아니오”</strong>를 선택해 주세요.</p>
          </div>
            <p>본 실험은 컴퓨터 환경에 맞게 구성되어 있습니다.<br>
            원활한 실험 진행을 위해 가능하면 컴퓨터를 이용해 참여해 주세요.</p>
        </div>
      `,
      `
      <div class="content">
        <h3>예를 들어, 다음과 같은 화면을 보게 됩니다:</h3>
        <div class="example-screen">
          <div class="trial-card">
            <div class="sentence-box">
              <div class="sentence-label">
                문장 1
              </div>
              <p>
                민수가 지수를 도와주었다.
              </p>
              </div>
            <div class="sentence-box">
              <div class="sentence-label">
                문장 2
              </div>
              <p>
                지수는 민수에게 도움을 받았다.
              </p>
              </div>
            </div>
            <p class="trial-question">
              문장 1을 문장 2와 같이 바꾸어 말할 수 있나요?
            </p>
            <div style="margin-top:20px;">
              <button class="jspsych-btn" disabled>예</button>
              <button class="jspsych-btn" disabled>아니오</button>
            </div>
          </div>
        </div>
          <p>
            이와 같은 방식으로 두 문장의 의미를 비교한 뒤, 본인의 판단에 따라 <strong>“예”</strong> 또는 <strong>“아니오”</strong>를 선택해 주세요.
          </p>
          <p>
            다음으로 실제 실험과 동일한 형식의 문항 두 개를 더 보여드리겠습니다.<br>
            화면 구성과 응답 방식을 보여드리기 위한 예시이며, 응답 내용은 기록되지 않으니 편하게 선택해 주세요.
          </p>
        `
      ],
      show_clickable_nav: true,
      button_label_previous: "이전",
      button_label_next: "다음",
      data: { phase: "instructions" }
    };

    timeline.push(instructions);

    //Practice trials
    function makePracticeTrial(sentence, probe) {
      return {type: jsPsychHtmlButtonResponse,
        record_data: false,
        stimulus: `
          <div class="trial-card">
            <div class="sentence-box">
              <div class="sentence-label">
                문장 1
              </div>
              <p>
                ${sentence}
              </p>
              </div>
            </div>
            <div class="sentence-box">
              <div class="sentence-label">
                문장 2
              </div>
              <p>
                ${probe}
              </p>
              </div>
            </div>
            <p class="trial-question">
              문장 1을 문장 2와 같이 바꾸어 말할 수 있나요?
            </p>
          </div>
        `,
        choices: response_buttons
      };
    }
    // Practice 1: natural paraphrase
    timeline.push(
      makePracticeTrial(
        "민수가 지수에게 우산을 빌려주었다.",
        "지수는 민수에게 우산을 빌렸다."
      )
    );
    // Practice 2: not a paraphrase
    timeline.push(
      makePracticeTrial(
        "수진이가 문을 열었다.",
        "수진이가 문을 닫았다."
      )
    );

    timeline.push({
    type: jsPsychHtmlButtonResponse,
    record_data: false,
    stimulus: `
      <h2>
        이제 실험을 시작하겠습니다.
      </h2>
      <div class="begin-box">
        <p>이 실험은 정답을 맞히는 시험이 아닙니다. 본인의 자연스러운 판단에 따라 답해 주세요.</p>
        <p>별도의 시간 제한은 없지만 너무 오래 고민하지 마시고, 처음 읽었을 때의 느낌에 따라 선택해주세요.</p>
        <p>준비가 되시면 아래의 "시작" 버튼을 클릭해주세요.</p>
      </div>
    `,
    choices: ["시작"],
    data: { phase: "begin_main" }
    });

    //Run the experiment 
    function makeMeaningTrial(item) {
    return {
      type: jsPsychHtmlButtonResponse,
      save_trial_parameters: {
        stimulus: false
      },
      stimulus: `
      <div class="trial-card">
        <div class="sentence-box">
          <div class="sentence-label">
            문장 1
          </div>
            <p>${item.sentence}</p>
          </div>
        <div class="sentence-box">
          <div class="sentence-label">
            문장 2
          </div> 
            <p>${item.probe}</p>
          </div>
        </div>
        <p class="trial-question">
          문장 1을 문장 2와 같이 바꾸어 말할 수 있나요?
        </p>
      </div>
    `,
    choices: response_buttons,
    data: {
      subject_id: subject_id,
      list_number: list_number,
      item_id: item.id,
      item_type: item.trial_type,
      filler_type:
        item.filler_type ?? "",
      qp_position:
        item.qp_position ?? "",
      negation_form:
        item.negation_form ?? "",
      probe_type:
        item.probe_type ?? "",
      sentence:

      expected_response:

      response_label: "",
      response_binary: "",
      correct: ""
      },

      on_finish: function(data) {
        const selected_label =
          response_buttons[data.response];
        data.response_label =
          selected_label;
        data.response_binary =
          selected_label === "예"
            ? "yes"
            : "no";
        if (data.expected_response !== "") {
          data.correct =
            data.response_binary ===
            data.expected_response;
          }
        }
      };
    }

    const experimental_conditions = [
      {qp_position: "object",  negation_form: "LFN", probe_type: "surface"},
      {qp_position: "object",  negation_form: "LFN", probe_type: "inverse"},
      {qp_position: "object",  negation_form: "SFN", probe_type: "surface"},
      {qp_position: "object",  negation_form: "SFN", probe_type: "inverse"},
      {qp_position: "subject", negation_form: "LFN", probe_type: "surface"},
      {qp_position: "subject", negation_form: "LFN", probe_type: "inverse"},
      {qp_position: "subject", negation_form: "SFN", probe_type: "surface"},
      {qp_position: "subject", negation_form: "SFN", probe_type: "inverse"}
    ];

    // CHECK - loading stimulus file
    if (
      !Array.isArray(window.EXP1_STIMULI) || !Array.isArray(window.EXP1_FILLERS)
    ) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div class="error-box">
            <h2>Stimulus file not loaded</h2>
            <p>
              <code>stims.js</code> must define:
            </p>
            <p>
              <code>window.EXP1_STIMULI</code><br>
              <code>window.EXP1_FILLERS</code>
            </p>
          </div>
        `,
        choices: "NO_KEYS"
      });
    } else {
    // 1. Select 32 targets:
    // Each participant sees 32 target: 4 OBJ LFN surface, 4 OBJ LFN inverse, 4 OBJ SFN surface, 4 OBJ SFN inverse, 4 SUBJ LFN surface, 4 SUBJ LFN inverse, 4 SUBJ SFN surface, 4 SUBJ SFN inverse

    const selected_targets = window.EXP1_STIMULI.filter(stim => {
    // Items 1–8 start in the 8 different conditions. Items 9–16, 17–24, and 25–32 repeat the pattern.
      const base_condition = (stim.item - 1) % 8;
    // Rotate condition assignment across the 8 lists.
      const condition_index = (base_condition + (list_number - 1)) % 8;
      const required_condition = experimental_conditions[condition_index];
      return (
        stim.qp_position === required_condition.qp_position &&
        stim.negation_form === required_condition.negation_form &&
        stim.probe_type === required_condition.probe_type
        );
    });

    // 2. Select 32 fillers: 8 F1 + 8 F2 + 8 F3 + 8 F4
    // Convert one BASE_FILLERS row into an experimental trial object
    function makeFillerTrial(base_row, probe_type) {
      const [
        filler_type,
        item,
        qp_position,
        negation_form,
        sentence,
        true_probe,
        false_probe
      ] = base_row;
      const position_code =
        qp_position === "subject"
          ? "SUBJ"
          : "OBJ";
      const negation_code =
        negation_form === null
          ? ""
          : `_${negation_form}`;
      const probe =
        probe_type === "true"
          ? true_probe
          : false_probe;
      return {
        id:
          `${filler_type}_` +
          `${String(item).padStart(2, "0")}_` +
          `${position_code}` +
          `${negation_code}_` +
          `${probe_type.toUpperCase()}`,
        item: item,
        trial_type: "filler",
        filler_type: filler_type,
        qp_position: qp_position,
        negation_form: negation_form,
        probe_type: probe_type,
        sentence: sentence,
        probe: probe,
        expected_response:
          probe_type === "true"
            ? "yes"
            : "no"
      };
    }
    // Helper: get all BASE rows belonging to one filler item
    function getBaseFillerRows(
      filler_type,
      item_number
    ) {
      return BASE_FILLERS.filter(row =>
        row[0] === filler_type &&
        row[1] === item_number
      );
    }
    // F1
    // Each item has exactly 4 structural versions: 0 = subject LFN / 1 = subject SFN / 2 = object LFN / 3 = object SFN
    // Across 8 items: 2 subject LFN / 2 subject SFN / 2 object LFN / 2 object SFN
    // Probe: 4 TRUE + 4 FALSE
    const selected_F1 =
      Array.from({ length: 8 },(_, index) => {
          const item_number = index + 1;
          const rows = getBaseFillerRows(
              "F1",
              item_number
            );
          if (rows.length !== 4) {
            throw new Error(`F1 item ${item_number} should have 4 base rows, but has ${rows.length}`);
          }
          // Rotate structural version across lists
          const structure_index =(
              index + (list_number - 1)
            ) % 4;
          // Alternate TRUE/FALSE
          const probe_type =(
              index + (list_number - 1)
            ) % 2 === 0
              ? "true"
              : "false";
          return makeFillerTrial(
            rows[structure_index],
            probe_type
          );
        }
      );
    // F3
    // Same structure as F1:  4 versions per lexical item
    // 4 TRUE + 4 FALSE
    const selected_F3 =
      Array.from({ length: 8 },(_, index) => {
          const item_number = index + 1;
          const rows = getBaseFillerRows(
              "F3",
              item_number
            );
          if (rows.length !== 4) {
            throw new Error(`F3 item ${item_number} should have 4 base rows, but has ${rows.length}`);
          }
          const structure_index =(
              index +
              (list_number - 1)
            ) % 4;
          // Shift probe pattern relative to F1
          const probe_type =(
              index +
              list_number
            ) % 2 === 0
              ? "true"
              : "false";
          return makeFillerTrial(
            rows[structure_index],
            probe_type
          );
        }
      );
    // F2 / F4
    // Each lexical item has 2 versions: 0 = subject / 1 = object
    // Each family: 4 subject + 4 object / 4 TRUE + 4 FALSE
    function selectSimpleFamily(
      filler_type,
      probe_shift
    ) {
      return Array.from(
        { length: 8 },(_, index) => {
          const item_number =index + 1;
          const rows = getBaseFillerRows(
              filler_type,
              item_number
            );
          if (rows.length !== 2) {
            throw new Error(`${filler_type} item ${item_number} should have 2 base rows, but has ${rows.length}`);
          }
          // Rotate subject/object across lists
          const position_index = (
              index + (list_number - 1)
            ) % 2;
          const probe_type = (
              index + (list_number - 1) + probe_shift
            ) % 2 === 0
              ? "true"
              : "false";
          return makeFillerTrial(
            rows[position_index],
            probe_type
          );
        }
      );
    }
    const selected_F2 = selectSimpleFamily("F2", 0);
    const selected_F4 = selectSimpleFamily("F4",1);
   
    // Combine all 32 fillers
    const selected_fillers = [
      ...selected_F1,
      ...selected_F2,
      ...selected_F3,
      ...selected_F4
    ];

    // Randomize targets

    const randomized_targets =
      jsPsych.randomization.shuffle(selected_targets);

    // Randomize fillers

    const randomized_fillers =
      jsPsych.randomization.shuffle(selected_fillers);

    // There are 33 possible gaps around 32 targets:
    // Place each filler in a different gap. Therefore two fillers can never occur consecutively.
    const possible_gaps =
      Array.from(
        {length: randomized_targets.length + 1},
        (_, index) => index
      );
    const selected_gaps =
      jsPsych.randomization
        .sampleWithoutReplacement(possible_gaps,randomized_fillers.length);
    // Associate one filler with each selected gap
    const gap_fillers = {};
    selected_gaps.forEach(
      (gap, index) => {
        gap_fillers[gap] = randomized_fillers[index];
      }
    );

    // Build final sequence
    const randomized_trials = [];
    for (
      let i = 0;
      i <= randomized_targets.length;
      i++
    ) {
      // Add filler if this gap was selected
      if (gap_fillers[i] !== undefined) 
      {randomized_trials.push(gap_fillers[i]);}
      // Add next target
      if (i < randomized_targets.length) {
        randomized_trials.push(randomized_targets[i]);
      }
    }
    
    // 4. Add all 64 trials
    randomized_trials.forEach(
      item => {
        timeline.push(makeMeaningTrial(item));
      }
    );

    // Payment contact
    const payment_contact = {
      type: jsPsychSurveyHtmlForm,
      preamble: `
         <div style="max-width:900px; margin:auto; text-align:center;">
          <h3>
            사례비 지급을 위한 계좌 정보
          </h3>
          <p>
            연구 참여 사례비를 보내드리기 위해 계좌 정보를 수집하고 있습니다. 아래에 정보를 입력해 주세요.
          </p>
        </div>
      `,
      html: `
        <div style="max-width:700px; margin:30px auto; text-align:center;">
          <p> 
            <strong>예금주명</strong>
          </p>
          <input type="text" name="account_holder" required style="width:200px;padding:10px;font-size:18px;text-align:center;">
          <p>
            <strong>은행</strong>
          </p>
          <input type="text" name="bank_name"
            placeholder="예: 우리" required style="width:200px;padding:10px;font-size:18px;text-align:center;">
          <p>
            <strong>계좌번호</strong>
          </p>
          <input type="text" name="account_number" placeholder="예: 1002-012-567890" required style="width:220px;padding:10px;font-size:18px;text-align:center;">
          <p style="font-size:15px; color:#64748b;">
            입력하신 정보는 사례비 지급 외의 용도로
            사용되지 않으며, 지급이 완료된 후 즉시 폐기됩니다.
          </p>
        </div>
      `,
      button_label: "제출",
      data: {
        phase: "payment_contact",
        subject_id: subject_id
      },
      on_finish: function(data) {
        data.account_holder = data.response.account_holder.trim();
        data.bank_name = data.response.bank_name.trim();
        data.account_number = data.response.account_number.trim();
      }
    };

    timeline.push(payment_contact);

    //Saving data 
    const filename = `exp1_${subject_id}.csv`;

    const save_data = {
      type: jsPsychPipe,
      action: "save",
      experiment_id: "DpvkvDr9rv2q",
      filename: filename,
      data_string: ()=>"\uFEFF" + jsPsych.data.get().csv(),
      wait_message: `
        <p>응답을 저장하고 있습니다.</p>
        <p>창을 닫지 마시고 잠시만 기다려주세요.</p>
      `
    };

    timeline.push(save_data)

    // ============================================================
